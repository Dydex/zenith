[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun" # Uniswap v4 relies on transient storage (EIP-1153)
optimizer = true
optimizer_runs = 800
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

# Default settings: fast enough to run on every push in CI.
[invariant]
runs = 32
depth = 64
fail_on_revert = false

# Deep settings for evidence runs: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 256
depth = 128
fail_on_revert = false

[fmt]
line_length = 120
sort_imports = true
